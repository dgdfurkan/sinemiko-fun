<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sinemiko Fun</title>
  <meta name="description" content="Furkan ile Sinem'in oyun gecesi: Reverse Play, Fısıltı Challenge, Kim Daha? ve daha fazlası.">
  <meta name="theme-color" content="#fff3e2">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/fx.css">
  <link rel="stylesheet" href="css/games.css">
  <script type="module" src="js/main.js"></script>
</head>
<body data-theme="home">
  <div class="backdrop" aria-hidden="true">
    <div class="wash"></div>
    <div class="pattern" id="pattern"></div>
    <div class="grain" id="grain"></div>
  </div>
  <div class="bubbles" id="bubbles" aria-hidden="true"></div>
  <div class="app" id="app">
    <header class="topbar" id="topbar"></header>
    <main class="view" id="view"></main>
  </div>
  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
  <div class="wipe" id="wipe" aria-hidden="true"><div class="wipe-a"></div><div class="wipe-b"></div></div>
  <div id="sheets"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <noscript><p class="noscript">Bu oyunlar için JavaScript açık olmalı.</p></noscript>
</body>
</html>
